name: Mdc Workflow

on:
  push:
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name:
        run: echo "Building App"
  dev:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: development phase
        run: echo "Deploying on dev environment"
  qa:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: quality phase
        run: echo "QA test"

  approval:
    needs:
      - dev
      - qa
    runs-on: ubuntu-latest

    steps:
      - name: Approval Env
        run: echo "Deploying on Approval environment"

  prod:
    needs:
      - approval
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Prod
        run: echo "Deploying on Prod environment"